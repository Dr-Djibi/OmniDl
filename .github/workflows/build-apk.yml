name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  # Permet de lancer le build manuellement depuis l'interface GitHub
  workflow_dispatch:

jobs:
  build:
    name: Compilation de l'APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: ☕ Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📥 Installation des dépendances
        run: npm install

      - name: ⚙️ Génération du projet Android (Prebuild)
        run: npx expo prebuild -p android --clean

      - name: 🚀 Compilation de l'APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 💾 Sauvegarde de l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: OmniDL-App-Android
          path: android/app/build/outputs/apk/release/app-release.apk
