name: Build APK / AAB Binaries

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development
      platform:
        description: 'Target Platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all

jobs:
  quality-checks:
    name: Impeccable Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🩺 Run Expo Doctor
        run: npm run doctor

      - name: 🧹 Run ESLint
        run: npm run lint

      - name: 📘 Run TypeScript Check
        run: npm run typecheck

      - name: 📦 Verify Bundle Export
        run: npm run check

      - name: 🧪 Run Quality Test Suite
        run: npm test

  eas-build:
    name: EAS / Release Binary Build
    needs: quality-checks
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🚀 Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ Trigger EAS Build
        id: eas-build-step
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          PLATFORM="${{ github.event.inputs.platform || 'android' }}"
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
