name: Build Android APK / Play Store AAB

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - store

permissions:
  contents: write

jobs:
  quality-checks:
    name: Impeccable Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧪 Run Quality Test Suite
        run: npm test

  eas-build:
    name: EAS Android build
    needs: quality-checks
    runs-on: ubuntu-latest
    env:
      EAS_PROFILE: ${{ github.event.inputs.profile || 'production' }}

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🚀 Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🏗️ Build Android binary with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile "$EAS_PROFILE" --non-interactive --wait --json > eas-build.json
          BUILD_ID="$(jq -r '.[0].id // empty' eas-build.json)"
          if [ -z "$BUILD_ID" ]; then
            echo "EAS did not return a build ID."
            exit 1
          fi

          eas build:download --id "$BUILD_ID" --json > eas-download.json
          ARTIFACT_PATH="$(jq -r '.path // empty' eas-download.json)"
          if [ -z "$ARTIFACT_PATH" ] || [ ! -f "$ARTIFACT_PATH" ]; then
            echo "EAS did not provide a downloadable build artifact."
            exit 1
          fi

          if [ "$EAS_PROFILE" = "production" ]; then
            cp "$ARTIFACT_PATH" OmniDL.apk
          else
            cp "$ARTIFACT_PATH" OmniDL.aab
          fi

      - name: 🏷️ Select GitHub Release
        id: release
        if: env.EAS_PROFILE == 'production'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./app.json').expo.version")"
            RELEASE_TAG="v$VERSION"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: 🚀 Create GitHub Release if needed
        if: env.EAS_PROFILE == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi

      - name: 📥 Attach APK to GitHub Release
        if: env.EAS_PROFILE == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" OmniDL.apk --clobber

      - name: 📦 Save Play Store AAB
        if: env.EAS_PROFILE == 'store'
        uses: actions/upload-artifact@v4
        with:
          name: OmniDL-Play-Store-AAB
          path: OmniDL.aab
          if-no-files-found: error
          retention-days: 30
